# Runs the unit tests of the fork's own modules (`app/src/ward`) on a hosted runner, so the
# fork does not depend on the upstream `Warp CI`, which is skipped here. The toolchain steps
# match `fork_windows.yml`.
name: Fork tests

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: fork-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "4"
      CARGO_PROFILE_TEST_DEBUG: "0"
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.92.0 --profile minimal --target x86_64-pc-windows-msvc
          rustup component add clippy --toolchain 1.92.0
          rustup default 1.92.0

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: fork-tests
          cache-on-failure: true

      - name: Install protoc
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $env:RUNNER_TEMP 'protoc.zip'
          $dir = Join-Path $env:RUNNER_TEMP 'protoc'
          Invoke-WebRequest -Uri 'https://github.com/protocolbuffers/protobuf/releases/download/v29.3/protoc-29.3-win64.zip' -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dir
          "PROTOC=$dir\bin\protoc.exe" >> $env:GITHUB_ENV
          & "$dir\bin\protoc.exe" --version

      # The git tests clone local repositories; the runner's git needs an identity.
      - name: Configure git
        shell: pwsh
        run: |
          git config --global user.name 'Fork CI'
          git config --global user.email 'fork-ci@example.com'
          git config --global init.defaultBranch main

      - name: Test the Ward modules
        shell: pwsh
        run: "cargo test -p warp --lib -- ward::"

      - name: Clippy on the Ward modules
        shell: pwsh
        run: cargo clippy -p warp --lib --tests
